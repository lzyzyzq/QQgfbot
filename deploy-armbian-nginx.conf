# Armbian + nginx + Node.js QQ Bot 反代配置（简化版）
#
# 适用：Debian bookworm / Armbian，站点根目录 /var/www/html
# 用法：将本文件放到 /etc/nginx/sites-enabled/qq-bot.conf
#       nginx -t && systemctl reload nginx
#
# 路由逻辑：
#   - 任何 .php 请求（index.php / sysinfo.php / cs.php）仍走 PHP-FPM
#   - 其余全部请求（/ 根路径、/api、/webhook、管理面板静态资源）反代到 Node:3000
#
# 注意：若 sites-enabled/ 下已有 default 站点同时监听 80，请删除或注释它，
#       否则两个 server 块会按 default_server 规则竞争。

server {
    listen 80;
    listen [::]:80;
    server_name armbian.tailaa2e36.ts.net _;

    root /var/www/html;
    index index.php index.html;

    # 允许大文件上传/下载（插件包、修复包、备份等）
    client_max_body_size 200m;

    # PHP-FPM：处理所有 .php 文件（保持现有 PHP 站点功能）
    location ~ \.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }

    # 拒绝敏感文件访问
    location ~ /\.env$ {
        deny all;
    }

    # Node.js 服务：所有非 PHP 请求（含 / 根路径、/api、/webhook、管理面板）
    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
