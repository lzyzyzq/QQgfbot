<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#0e1117">
<title>消息工作台 - QQ Bot 管理面板</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0e1117;--bg2:#151a24;--bg3:#1d2330;--bg4:#252d3d;
  --text:#e7ecf3;--text2:#8c97a9;--text3:#5e6a7d;
  --accent:#4f8cff;--accent2:#3b6fe0;--accent-soft:rgba(79,140,255,.14);
  --danger:#f2555a;--success:#35c46a;--warn:#f0a72a;
  --border:#283143;--border2:#333e52;--radius:12px;
  --shadow:0 8px 28px rgba(0,0,0,.34);
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'PingFang SC','Microsoft YaHei',sans-serif;background:#080b11;color:var(--text);overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:rgba(140,151,169,.26);border-radius:4px}
::-webkit-scrollbar-thumb:hover{background:rgba(140,151,169,.46)}
::-webkit-scrollbar-track{background:transparent}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
.rt-app{display:flex;flex-direction:column;height:100vh;height:var(--rt-vh,100dvh);overflow:hidden;width:100%;max-width:1120px;margin:0 auto;background:var(--bg);border-left:1px solid var(--border);border-right:1px solid var(--border)}
@media(max-width:1120px){.rt-app{border-left:none;border-right:none}}

/* ===== 顶栏 ===== */
.rt-topbar{display:flex;align-items:center;gap:14px;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));background:linear-gradient(180deg,#1c2434,#141a25);border-bottom:1px solid var(--border);flex-shrink:0;box-shadow:0 2px 14px rgba(0,0,0,.32);z-index:6;flex-wrap:wrap}
.rt-brand{display:flex;align-items:center;gap:9px;white-space:nowrap}
.rt-brand .rt-logo{width:28px;height:28px;border-radius:9px;background:linear-gradient(135deg,var(--accent),#8a5cff);display:flex;align-items:center;justify-content:center;font-size:15px;box-shadow:0 3px 10px rgba(79,140,255,.4)}
.rt-title{font-size:15px;font-weight:700;letter-spacing:.4px}
.rt-bot{display:flex;align-items:center;gap:8px;min-width:0}
.rt-bot select{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 30px 7px 12px;font-size:13px;outline:none;max-width:230px;cursor:pointer;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--text2) 50%),linear-gradient(135deg,var(--text2) 50%,transparent 50%);background-position:calc(100% - 16px) 15px,calc(100% - 11px) 15px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
.rt-bot select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rt-appid{font-size:11px;color:var(--text2);background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:3px 10px;white-space:nowrap}
.rt-tabs{display:flex;gap:4px;background:var(--bg3);border:1px solid var(--border);border-radius:10px;padding:4px}
.rt-tab{padding:6px 15px;font-size:13px;border-radius:7px;cursor:pointer;color:var(--text2);user-select:none;transition:.15s;white-space:nowrap}
.rt-tab:hover{color:var(--text)}
.rt-tab.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(79,140,255,.4)}
.rt-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.rt-mini{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:9px;padding:7px 15px;font-size:12.5px;transition:.15s}
.rt-mini:hover{color:var(--text);border-color:var(--accent)}
.rt-conn{font-size:12px;color:var(--text2);display:flex;align-items:center;gap:6px;white-space:nowrap;background:var(--bg3);border:1px solid var(--border);border-radius:20px;padding:5px 12px}
.rt-dot{width:8px;height:8px;border-radius:50%;background:var(--text2);flex:none;transition:.3s}
.rt-dot.on{background:var(--success);box-shadow:0 0 8px var(--success)}
.rt-dot.off{background:var(--danger);box-shadow:0 0 8px rgba(242,85,90,.6)}

/* ===== 主体 ===== */
.rt-body{flex:1;display:flex;min-height:0}
.rt-side{width:312px;flex-shrink:0;background:var(--bg2);border-right:1px solid var(--border);display:flex;flex-direction:column;min-height:0}
.rt-side-head{padding:12px 14px 8px;display:flex;flex-direction:column;gap:9px;border-bottom:1px solid var(--border)}
.rt-side-top{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--text2);font-weight:600;letter-spacing:.3px}
.rt-count{background:var(--bg4);border:1px solid var(--border);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--text2)}
.rt-search{display:flex;align-items:center;gap:7px;background:var(--bg3);border:1px solid var(--border);border-radius:9px;padding:7px 11px;transition:.15s}
.rt-search:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rt-search svg{flex:none;opacity:.55}
.rt-search input{flex:1;min-width:0;background:none;border:none;outline:none;color:var(--text);font-size:13px}
.rt-search input::placeholder{color:var(--text3)}
.rt-convs{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:6px}
.rt-conv{display:flex;gap:11px;padding:10px 11px;cursor:pointer;border-radius:11px;transition:.14s;position:relative}
.rt-conv:hover{background:var(--bg3)}
.rt-conv.active{background:linear-gradient(90deg,var(--accent-soft),transparent)}
.rt-conv.active::before{content:'';position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:0 3px 3px 0;background:var(--accent)}
.rt-avatar{width:40px;height:40px;border-radius:12px;background:linear-gradient(135deg,#2b3550,#222b40);color:#9db8ff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none;position:relative;overflow:hidden;user-select:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04)}
.rt-avatar img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.rt-avatar.sm{width:34px;height:34px;border-radius:10px;font-size:13px}
.rt-conv.active .rt-avatar{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.rt-conv-main{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.rt-conv-top{display:flex;align-items:baseline;gap:6px}
.rt-conv-name{font-size:13.5px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-conv-time{font-size:10.5px;color:var(--text3);flex:none}
.rt-conv-sub{font-size:12px;color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-badge{display:inline-block;font-size:10px;padding:1px 7px;border-radius:9px;background:var(--accent-soft);color:#a8c4ff;flex:none}
.rt-tag{font-size:10px;color:var(--text2);background:var(--bg4);border:1px solid var(--border);border-radius:6px;padding:0 6px;flex:none;line-height:16px}
.rt-empty{padding:52px 22px;text-align:center;color:var(--text2);font-size:13px;line-height:1.9}

/* ===== 聊天区 ===== */
.rt-chat{flex:1;display:flex;flex-direction:column;min-width:0;min-height:0;background:radial-gradient(1100px 460px at 82% -12%,rgba(79,140,255,.07),transparent)}
.rt-chat-head{padding:11px 18px;background:rgba(21,26,36,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:11px;flex-shrink:0}
.rt-back{display:none;background:var(--bg3);border:1px solid var(--border);color:var(--text);font-size:16px;border-radius:9px;width:34px;height:34px;line-height:1;flex:none}
.rt-back:active{background:var(--bg4)}
.rt-chat-title{flex:1;min-width:0}
.rt-chat-name{font-size:15px;font-weight:700;display:flex;align-items:center;gap:0;overflow:hidden}
.rt-chat-name .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rt-kind{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:6px;margin-right:7px;flex:none}
.rt-kind.g{background:rgba(53,196,106,.16);color:#8ee3ac}
.rt-kind.c{background:rgba(240,167,42,.16);color:#f4cd83}
.rt-head-actions{display:flex;gap:8px;align-items:center;flex:none}
.rt-hbtn{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:9px;padding:7px 14px;font-size:12.5px;white-space:nowrap;transition:.15s}
.rt-hbtn:hover{color:#fff;border-color:var(--accent);background:var(--accent-soft)}
.rt-msgs{flex:1;overflow-y:auto;overflow-x:hidden;padding:16px 16px 6px;display:flex;flex-direction:column;gap:12px;min-height:0;scroll-behavior:smooth}
.rt-msg{display:flex;gap:9px;max-width:76%;align-items:flex-start;animation:rtIn .16s ease}
@keyframes rtIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.rt-msg.out{align-self:flex-end;flex-direction:row-reverse}
.rt-msg-av{width:33px;height:33px;border-radius:9px;background:linear-gradient(135deg,#2b3550,#222b40);color:#9db8ff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none;overflow:hidden;position:relative;user-select:none}
.rt-msg-av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.rt-msg.out .rt-msg-av{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff}
.rt-msg-body{min-width:0}
.rt-msg.out .rt-msg-body{display:flex;flex-direction:column;align-items:flex-end}
.rt-msg .who{font-size:11px;color:var(--text3);margin:0 4px 5px;word-break:break-all;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rt-msg.out .who{flex-direction:row-reverse}
.rt-who-qq{color:#9db8ff;font-size:10px;background:var(--accent-soft);padding:0 6px;border-radius:6px}
.rt-msg .bubble{background:var(--bg2);border:1px solid var(--border);border-radius:13px;border-top-left-radius:5px;padding:9px 12px;font-size:13px;line-height:1.6;word-break:break-word;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.rt-msg.out .bubble{background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;color:#fff;border-top-left-radius:14px;border-top-right-radius:5px}
.rt-msg.pending .bubble{opacity:.6}
.rt-msg.pending .bubble::after{content:'';display:inline-block;width:12px;height:12px;margin-left:8px;border:2px solid rgba(255,255,255,.55);border-top-color:transparent;border-radius:50%;vertical-align:-2px;animation:rtSpin .7s linear infinite}
@keyframes rtSpin{to{transform:rotate(360deg)}}
.rt-msg .bubble a{color:inherit;text-decoration:underline;word-break:break-all}
.rt-msg .bubble img.rt-img{max-width:min(280px,100%);max-height:300px;border-radius:11px;display:block;margin:2px 0;cursor:zoom-in;background:var(--bg3)}
.rt-msg .bubble audio{height:36px;max-width:100%;margin-top:5px}
.rt-msg .mtime{font-size:10px;color:var(--text3);margin:5px 4px 0}
.rt-msg.out .mtime{text-align:right}
.rt-placeholder{flex:1;display:flex;align-items:center;justify-content:center;color:var(--text2);font-size:14px;text-align:center;padding:30px;line-height:1.9}

/* ===== 输入区 ===== */
.rt-editor{border-top:1px solid var(--border);background:linear-gradient(180deg,var(--bg2),#121721);padding:9px 14px;padding-bottom:calc(9px + env(safe-area-inset-bottom));display:flex;gap:10px;align-items:flex-end;flex-shrink:0}
.rt-editor-main{flex:1;display:flex;flex-direction:column;gap:6px;min-width:0}
.rt-tools{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;align-items:center;scrollbar-width:none}
.rt-tools::-webkit-scrollbar{display:none}
.rt-tool{background:var(--bg3);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:4px 11px;font-size:12px;transition:.15s;flex:none}
.rt-tool:hover{color:#fff;border-color:var(--accent);background:var(--accent-soft)}
.rt-tool.active{color:#fff;border-color:var(--accent);background:var(--accent-soft)}
.rt-hint{font-size:11px;color:var(--text3);margin-left:auto}
.rt-editor textarea{width:100%;resize:none;height:42px;max-height:120px;background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.5;outline:none;transition:.15s;overflow-y:auto}
.rt-editor textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.rt-editor textarea:disabled{opacity:.55}
.rt-send{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;border:none;border-radius:10px;padding:0 22px;height:42px;font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 4px 14px rgba(79,140,255,.36);transition:.15s;flex:none}
.rt-send:hover{filter:brightness(1.08)}
.rt-send:active{transform:translateY(1px)}
.rt-send:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}

/* ===== QQ 表情面板 ===== */
.rt-emoji{display:none;grid-template-columns:repeat(auto-fill,minmax(42px,1fr));gap:2px;max-height:172px;overflow-y:auto;background:var(--bg3);border:1px solid var(--border);border-radius:11px;padding:7px}
.rt-emoji.show{display:grid}
.rt-emoji button{background:transparent;border:none;padding:3px;border-radius:8px;cursor:pointer;line-height:0;display:flex;align-items:center;justify-content:center}
.rt-emoji button:hover{background:var(--accent-soft)}
.rt-emoji img{width:26px;height:26px;display:block}

/* ===== 提示 ===== */
.rt-toast{position:fixed;top:calc(16px + env(safe-area-inset-top));left:50%;transform:translateX(-50%) translateY(-8px);background:var(--bg4);border:1px solid var(--border2);border-radius:10px;padding:10px 20px;font-size:13px;z-index:99;opacity:0;pointer-events:none;transition:.2s;box-shadow:var(--shadow);max-width:88vw;text-align:center}
.rt-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.rt-toast.err{border-color:var(--danger);color:#fca5a5}

/* ===== 手机端（紧凑，保证输入框完整可见） ===== */
@media(max-width:820px){
  .rt-topbar{gap:6px;padding:6px 10px;padding-top:calc(6px + env(safe-area-inset-top))}
  .rt-title{display:none}
  .rt-brand .rt-logo{width:24px;height:24px;border-radius:8px;font-size:13px}
  .rt-bot select{max-width:132px;padding:5px 26px 5px 10px;font-size:12.5px;background-position:calc(100% - 14px) 12px,calc(100% - 9px) 12px}
  .rt-appid{display:none}
  .rt-right .rt-refresh{display:none}
  .rt-right{gap:6px}
  .rt-home{padding:4px 9px;font-size:11.5px}
  .rt-conn{padding:4px 9px;font-size:11px;gap:5px}
  .rt-tabs{order:3;width:100%;justify-content:space-between;padding:3px}
  .rt-tab{flex:1;text-align:center;padding:5px 0;font-size:12.5px}
  .rt-side{width:100%;border-right:none}
  .rt-side-head{padding:8px 11px 6px;gap:7px}
  .rt-search{padding:6px 10px}
  .rt-search input{font-size:12.5px}
  .rt-convs{padding:4px}
  .rt-conv{gap:9px;padding:8px 9px;border-radius:9px}
  .rt-avatar{width:38px;height:38px;border-radius:11px;font-size:14px}
  .rt-avatar.sm{width:32px;height:32px;border-radius:9px;font-size:12px}
  .rt-conv-name{font-size:13px}
  .rt-conv-sub{font-size:11.5px}
  .rt-empty{padding:36px 18px;font-size:12.5px}
  .rt-chat{display:none}
  .rt-app[data-view="chat"] .rt-topbar{display:none}
  .rt-app[data-view="chat"] .rt-side{display:none}
  .rt-app[data-view="chat"] .rt-chat{display:flex}
  .rt-app[data-view="chat"] .rt-chat-head{padding:7px 10px;padding-top:calc(7px + env(safe-area-inset-top));gap:9px}
  .rt-back{display:flex;align-items:center;justify-content:center;width:30px;height:30px;font-size:15px}
  .rt-chat-name{font-size:14px}
  .rt-hbtn{padding:5px 10px;font-size:12px}
  .rt-msgs{padding:10px 8px 3px;gap:9px}
  .rt-msg{max-width:92%;gap:7px}
  .rt-msg-av{width:28px;height:28px;border-radius:8px;font-size:10.5px}
  .rt-msg .who{font-size:10px;margin-bottom:2px}
  .rt-msg .bubble{padding:7px 10px;font-size:12.5px;line-height:1.5;border-radius:11px}
  .rt-msg .mtime{font-size:9px;margin-top:2px}
  .rt-placeholder{padding:18px;font-size:12.5px}
  .rt-editor{gap:6px;padding:6px 8px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
  .rt-editor textarea{font-size:13.5px;height:38px;max-height:96px;padding:8px 10px;border-radius:9px}
  .rt-editor-main{gap:5px}
  .rt-tools{gap:5px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
  .rt-tools::-webkit-scrollbar{display:none}
  .rt-tool{padding:3px 8px;font-size:11.5px;border-radius:7px;flex:none}
  .rt-send{padding:0 14px;height:38px;font-size:12.5px;border-radius:9px}
  .rt-hint{display:none}
  .rt-emoji{max-height:104px;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));padding:4px;border-radius:9px}
  .rt-emoji img{width:22px;height:22px}
  .rt-head-actions .rt-hbtn{padding:4px 8px}
}
@media(max-width:400px){
  .rt-tool{padding:4px 8px;font-size:11.5px}
  .rt-send{padding:0 12px;font-size:12.5px}
  .rt-chat-name{font-size:13px}
  .rt-avatar{width:34px;height:34px}
}
</style>
</head>
<body>
<div class="rt-app" id="rtApp" data-view="list">
  <header class="rt-topbar">
    <div class="rt-brand"><span class="rt-logo">&#128172;</span><span class="rt-title">消息工作台</span></div>
    <div class="rt-bot">
      <select id="rtBotSel" onchange="rtOnBot()"></select>
      <span class="rt-appid" id="rtAppId"></span>
    </div>
    <div class="rt-tabs" id="rtTabs">
      <div class="rt-tab active" data-scope="all" onclick="rtSetScope('all')">全部</div>
      <div class="rt-tab" data-scope="group" onclick="rtSetScope('group')">群聊</div>
      <div class="rt-tab" data-scope="c2c" onclick="rtSetScope('c2c')">私聊</div>
    </div>
    <div class="rt-right">
      <button class="rt-mini rt-home" onclick="rtGoHome()">&#8592; 主界面</button>
      <button class="rt-mini rt-refresh" onclick="rtLoadConvs(true)">刷新</button>
      <span class="rt-conn"><span class="rt-dot" id="rtDot"></span><span id="rtConnText">未连接</span></span>
    </div>
  </header>
  <div class="rt-body">
    <aside class="rt-side">
      <div class="rt-side-head">
        <div class="rt-side-top"><span>会话列表</span><span class="rt-count" id="rtConvCount">0</span></div>
        <label class="rt-search">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
          <input id="rtSearch" placeholder="搜索会话 / 群号 / QQ" oninput="rtRenderConvs()">
        </label>
      </div>
      <div class="rt-convs" id="rtConvs"><div class="rt-empty">加载中...</div></div>
    </aside>
    <section class="rt-chat">
      <div class="rt-chat-head" id="rtChatHead">
        <button class="rt-back" onclick="rtBackToList()" title="返回会话列表">&#8592;</button>
        <span class="rt-avatar sm" id="rtChatAvatar">?</span>
        <div class="rt-chat-title">
          <div class="rt-chat-name" id="rtChatName"><span class="nm">未选择会话</span></div>
        </div>
        <div class="rt-head-actions">
          <button class="rt-hbtn" id="rtGroupMgrBtn" style="display:none" onclick="rtOpenGroupMgr()">群管理</button>
          <button class="rt-hbtn" id="rtReloadBtn" style="display:none" onclick="rtReloadActive()">刷新</button>
        </div>
      </div>
      <div class="rt-msgs" id="rtMsgs"><div class="rt-placeholder">从左侧选择群聊或私聊，即可查看历史消息并实时预览新消息</div></div>
      <div class="rt-editor">
        <div class="rt-editor-main">
          <div class="rt-tools">
            <button class="rt-tool" onclick="rtPickMedia('image')" title="发送图片">图片</button>
            <button class="rt-tool" id="rtEmojiBtn" onclick="rtToggleEmoji()" title="QQ 表情">表情</button>
            <button class="rt-tool" onclick="rtPickMedia('video')" title="发送视频">视频</button>
            <span class="rt-hint">支持链接；Enter 发送，Shift+Enter 换行</span>
            <input type="file" id="rtMedia" style="display:none" onchange="rtUploadMedia(this)">
          </div>
          <div class="rt-emoji" id="rtEmoji"></div>
          <textarea id="rtInput" placeholder="输入消息…" disabled></textarea>
        </div>
        <button class="rt-send" id="rtSend" onclick="rtSend()" disabled>发送</button>
      </div>
    </section>
  </div>
</div>
<div class="rt-toast" id="rtToast"></div>
<script>
var rtState={bots:[],bot:null,scope:'all',convs:[],active:null,es:null,lastId:0,sending:false,fallbackTimer:null};

function rtEsc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function rtCookie(n){var m=document.cookie.match(new RegExp('(?:^|; )'+n+'=([^;]*)'));return m?decodeURIComponent(m[1]):''}
function rtToken(){var q='';try{q=new URLSearchParams(location.search).get('token')||''}catch(e){}return q||rtCookie('admin_token')||localStorage.getItem('admin_token')||''}
function rtToast(msg,isErr){var t=document.getElementById('rtToast');t.textContent=msg;t.className='rt-toast show'+(isErr?' err':'');clearTimeout(t._t);t._t=setTimeout(function(){t.className='rt-toast'},2600)}
function rtSessionExpired(){
  if(rtState._exp)return;rtState._exp=1;
  try{localStorage.removeItem('admin_token');document.cookie='admin_token=; path=/; max-age=0'}catch(e){}
  try{if(rtState.es){rtState.es.close();rtState.es=null}}catch(e){}
  rtToast('登录已过期，正在返回登录页…',true);
  setTimeout(function(){location.href='/'},900);
}
function rtApi(path,opts){opts=opts||{};var h=opts.headers||{};var tk=rtToken();if(tk)h['Authorization']='Bearer '+tk;if(opts.body&&typeof opts.body!=='string'){if(typeof FormData!=='undefined'&&opts.body instanceof FormData){/* multipart */}else{h['Content-Type']='application/json';opts.body=JSON.stringify(opts.body)}}opts.headers=h;opts.credentials='same-origin';return fetch(path,opts).then(function(r){if(r.status===401){rtSessionExpired();throw new Error('登录已过期')}return r.json().catch(function(){return {}}).then(function(j){if(!r.ok)throw new Error(j.error||('HTTP '+r.status));return j})})}
function rtFmtTime(s){if(!s)return '';var d=new Date(String(s).replace(' ','T'));if(isNaN(d.getTime()))return String(s).slice(5,16);var now=new Date();var sameDay=d.toDateString()===now.toDateString();var hm=('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2);return sameDay?hm:(d.getMonth()+1)+'/'+d.getDate()+' '+hm}
function rtShort(s,n){s=String(s==null?'':s);return s.length>n?s.slice(0,n)+'…':s}
function rtInitial(o){var n=String(o&&o.name||'').trim();return n?n.slice(0,1):(o&&o.type==='group'?'群':(o&&o.qq?'Q':'人'))}
function rtConvName(c){var isG=c.type==='group';return c.name||(isG?(c.group_number?('群 '+c.group_number):'群聊'):(c.qq?('QQ '+c.qq):'私聊用户'))}

function rtAvErr(img){
  var src=img.getAttribute('src')||'';
  var m=src.match(/^https:\/\/q([1-4])\.qlogo\.cn\/(.+)$/);
  if(m){var n=Number(m[1]);if(n<4){img.setAttribute('src','https://q'+(n+1)+'.qlogo.cn/'+m[2]);return}}
  img.remove();
}
function rtAvImg(url){return url?'<img src="'+rtEsc(url)+'" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="rtAvErr(this)">':''}

function rtAvatarHtml(o,sm){
  var cls='rt-avatar'+(sm?' sm':'');
  var label=rtEsc(rtInitial(o));
  return '<span class="'+cls+'">'+rtAvImg(o&&o.avatar)+label+'</span>';
}

function rtInit(){
  var qs=new URLSearchParams(location.search);
  var wantBot=qs.get('bot')||'';
  rtApi('/api/bots').then(function(bots){
    rtState.bots=bots||[];
    if(!rtState.bots.length){document.getElementById('rtConvs').innerHTML='<div class="rt-empty">暂无机器人</div>';return}
    var sel=document.getElementById('rtBotSel');
    sel.innerHTML=rtState.bots.map(function(b){return '<option value="'+rtEsc(b.appId)+'">'+rtEsc(b.name||b.appId)+'</option>'}).join('');
    var pick=null;
    if(wantBot){pick=rtState.bots.filter(function(b){return String(b.appId)===wantBot||String(b.id)===wantBot})[0]}
    if(!pick)pick=rtState.bots[0];
    sel.value=pick.appId;
    rtState.bot=pick;
    document.getElementById('rtAppId').textContent='APP_ID: '+pick.appId;
    rtState.lastId=0;
    rtOpenLive();
    rtLoadConvs();
  }).catch(function(e){rtToast('加载机器人失败：'+e.message,true);document.getElementById('rtConvs').innerHTML='<div class="rt-empty">加载失败：'+rtEsc(e.message)+'</div>'});
}

function rtOnBot(){
  var v=document.getElementById('rtBotSel').value;
  rtState.bot=rtState.bots.filter(function(b){return String(b.appId)===v})[0]||null;
  document.getElementById('rtAppId').textContent=rtState.bot?('APP_ID: '+rtState.bot.appId):'';
  rtState.active=null;
  rtState.lastId=0;
  rtResetChat();
  rtOpenLive();
  rtLoadConvs();
  history.replaceState(null,'','/realtime.html?bot='+encodeURIComponent(v));
}

function rtSetScope(s){
  rtState.scope=s;
  var tabs=document.querySelectorAll('#rtTabs .rt-tab');
  for(var i=0;i<tabs.length;i++)tabs[i].classList.toggle('active',tabs[i].getAttribute('data-scope')===s);
  rtState.active=null;
  rtResetChat();
  rtLoadConvs();
}

function rtLoadConvs(manual){
  if(!rtState.bot)return;
  var box=document.getElementById('rtConvs');
  if(!manual&&!rtState.convs.length)box.innerHTML='<div class="rt-empty">加载中...</div>';
  rtApi('/api/realtime/conversations?botId='+encodeURIComponent(rtState.bot.appId)+'&scope='+encodeURIComponent(rtState.scope)).then(function(data){
    rtState.convs=data.conversations||[];
    document.getElementById('rtConvCount').textContent=rtState.convs.length;
    rtRenderConvs();
    if(manual&&rtState.active){
      var still=rtState.convs.filter(function(c){return c.id===rtState.active.id&&c.type===rtState.active.type})[0];
      if(!still)rtResetChat();
    }
    if(!rtState.active&&rtState.convs.length&&window.innerWidth>820){
      rtOpenConv(rtState.convs[0].type,rtState.convs[0].id);
    }
  }).catch(function(e){box.innerHTML='<div class="rt-empty">加载失败：'+rtEsc(e.message)+'</div>'});
}

function rtRenderConvs(){
  var box=document.getElementById('rtConvs');
  var kw=(document.getElementById('rtSearch').value||'').trim().toLowerCase();
  var list=rtState.convs;
  if(kw)list=list.filter(function(c){return (rtConvName(c)+' '+(c.group_number||'')+' '+(c.qq||'')+' '+(c.openid||'')+' '+(c.last_text||'')).toLowerCase().indexOf(kw)>=0});
  if(!rtState.convs.length){box.innerHTML='<div class="rt-empty">'+rtEmptyText()+'</div>';return}
  if(!list.length){box.innerHTML='<div class="rt-empty">没有匹配「'+rtEsc(kw)+'」的会话</div>';return}
  box.innerHTML=list.map(function(c){
    var isG=c.type==='group';
    var name=rtConvName(c);
    var active=rtState.active&&rtState.active.id===c.id&&rtState.active.type===c.type?' active':'';
    var fallback=isG?((c.group_number?('群号 '+c.group_number):'群聊')+' · '+(c.member_count||0)+'人'):(c.qq?('QQ '+c.qq):'私聊');
    var tag=isG?(c.group_number?'<span class="rt-tag">群 '+rtEsc(c.group_number)+'</span>':''):(c.qq?'<span class="rt-tag">QQ '+rtEsc(c.qq)+'</span>':'');
    return '<div class="rt-conv'+active+'" onclick="rtOpenConv(\''+c.type+'\',\''+rtEsc(c.id)+'\')">'
      +rtAvatarHtml({name:name,avatar:c.avatar,type:c.type,qq:c.qq})
      +'<div class="rt-conv-main"><div class="rt-conv-top"><span class="rt-conv-name">'+rtEsc(name)+'</span>'+tag
      +'<span class="rt-conv-time">'+rtFmtTime(c.last_time)+'</span></div>'
      +'<div class="rt-conv-sub">'+(c.msg_count?'<span class="rt-badge">'+c.msg_count+'</span>':'')+rtEsc(rtShort(c.last_text||fallback,42))+'</div></div></div>';
  }).join('');
}

function rtEmptyText(){
  if(rtState.scope==='group')return '该机器人暂无群聊会话';
  if(rtState.scope==='c2c')return '该机器人暂无私聊会话';
  return '该机器人暂无会话记录';
}

function rtResetChat(){
  document.getElementById('rtChatName').innerHTML='<span class="nm">未选择会话</span>';
  rtSetChatAvatar({name:'?',type:'group'});
  document.getElementById('rtMsgs').innerHTML='<div class="rt-placeholder">从左侧选择群聊或私聊，即可查看历史消息并实时预览新消息</div>';
  var ta=document.getElementById('rtInput');ta.value='';ta.style.height='';ta.disabled=true;
  document.getElementById('rtSend').disabled=true;
  document.getElementById('rtGroupMgrBtn').style.display='none';
  document.getElementById('rtReloadBtn').style.display='none';
  document.getElementById('rtApp').setAttribute('data-view','list');
}

function rtSetChatAvatar(o){
  var el=document.getElementById('rtChatAvatar');if(!el)return;
  el.innerHTML=(o&&o.avatar?'<img src="'+rtEsc(o.avatar)+'" alt="" onerror="this.remove()">':'')+rtEsc(rtInitial(o));
}

function rtOpenConv(type,id){
  var c=rtState.convs.filter(function(x){return x.id===id&&x.type===type})[0];
  if(!c)return;
  rtState.active=c;
  rtCloseEmoji();
  rtRenderConvs();
  document.getElementById('rtApp').setAttribute('data-view','chat');
  try{if(window.innerWidth<=820&&((history.state||{}).view!=='chat'))history.pushState({view:'chat'},'')}catch(e){}
  var isG=type==='group';
  var name=rtConvName(c);
  document.getElementById('rtChatName').innerHTML='<span class="rt-kind '+(isG?'g':'c')+'">'+(isG?'群聊':'私聊')+'</span><span class="nm">'+rtEsc(name)+'</span>';
  rtSetChatAvatar({name:name,avatar:c.avatar,type:c.type,qq:c.qq});
  document.getElementById('rtGroupMgrBtn').style.display=isG?'':'none';
  document.getElementById('rtReloadBtn').style.display='';
  document.getElementById('rtMsgs').innerHTML='<div class="rt-placeholder">正在加载历史消息...</div>';
  var ta=document.getElementById('rtInput');ta.disabled=false;ta.style.height='';
  document.getElementById('rtSend').disabled=false;
  rtLoadHistory(type,id);
  if(window.innerWidth<=820)setTimeout(function(){try{ta.focus()}catch(e){}},200);
  if(!rtState.es)rtOpenLive();
}

function rtCopy(t){if(!t)return;try{navigator.clipboard.writeText(t);rtToast('已复制：'+t)}catch(e){}}

function rtLoadHistory(type,id){
  rtApi('/api/realtime/messages?botId='+encodeURIComponent(rtState.bot.appId)+'&type='+type+'&target='+encodeURIComponent(id)+'&limit=120')
    .then(function(data){
      if(!rtState.active||rtState.active.id!==id)return;
      var msgs=data.messages||[];
      var box=document.getElementById('rtMsgs');
      if(!msgs.length){box.innerHTML='<div class="rt-placeholder">暂无历史消息，等待新消息...</div>';return}
      box.innerHTML='';
      msgs.forEach(function(m){box.appendChild(rtMsgNode(m));rtState.lastId=Math.max(rtState.lastId,m.id||0)});
      rtScrollBottom();
    }).catch(function(e){document.getElementById('rtMsgs').innerHTML='<div class="rt-placeholder">历史消息加载失败：'+rtEsc(e.message)+'</div>'});
}

function rtReloadActive(){if(rtState.active)rtLoadHistory(rtState.active.type,rtState.active.id)}

function rtOpenLive(){
  if(!rtState.bot)return;
  rtCloseStream();
  rtSetConn('wait','连接中…');
  var tk=rtToken();
  var url='/api/realtime/live?botId='+encodeURIComponent(rtState.bot.appId)+'&sinceId='+rtState.lastId+(tk?'&token='+encodeURIComponent(tk):'');
  var watchdog=setTimeout(function(){
    if(rtState.es&&!rtState.es._opened){
      rtSetConn('off','轮询同步中');rtStartFallback();
      try{rtState.es.close()}catch(e){}rtState.es=null;
    }
  },4000);
  try{
    var es=new EventSource(url,{withCredentials:true});
    rtState.es=es;
    es.onopen=function(){es._opened=true;clearTimeout(watchdog);rtSetConn('on','实时同步中');rtStopFallback()};
    es.onmessage=function(ev){
      try{
        var m=JSON.parse(ev.data);
        if(!m.id||m.id<=rtState.lastId)return;
        rtState.lastId=m.id;
        if(rtState.active&&rtMatches(m)){
          var box=document.getElementById('rtMsgs');
          var ph=box.querySelector('.rt-placeholder');if(ph)ph.remove();
          var pend=box.querySelector('.rt-msg.pending');if(pend&&m.dir==='out')pend.remove();
          var near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
          box.appendChild(rtMsgNode(m));
          if(near)rtScrollBottom();
        }else{
          rtScheduleListRefresh();
        }
      }catch(e){}
    };
    es.onerror=function(){clearTimeout(watchdog);rtSetConn('off','连接中断，轮询同步');rtStartFallback()};
  }catch(e){clearTimeout(watchdog);rtSetConn('off','无法建立实时连接');rtStartFallback()}
}

function rtStartFallback(){
  if(rtState.fallbackTimer)return;
  rtState.fallbackTimer=setInterval(function(){
    if(!rtState.active||document.hidden)return;
    rtApi('/api/realtime/messages?botId='+encodeURIComponent(rtState.bot.appId)+'&type='+rtState.active.type+'&target='+encodeURIComponent(rtState.active.id)+'&limit=40')
      .then(function(data){
        var msgs=(data.messages||[]).filter(function(m){return m.id>rtState.lastId});
        if(!msgs.length)return;
        var box=document.getElementById('rtMsgs');
        var ph=box.querySelector('.rt-placeholder');if(ph)ph.remove();
        var near=box.scrollHeight-box.scrollTop-box.clientHeight<140;
        msgs.forEach(function(m){box.appendChild(rtMsgNode(m));rtState.lastId=Math.max(rtState.lastId,m.id)});
        if(near)rtScrollBottom();
      }).catch(function(){});
  },2500);
}
function rtStopFallback(){if(rtState.fallbackTimer){clearInterval(rtState.fallbackTimer);rtState.fallbackTimer=null}}

function rtMatches(m){
  var a=rtState.active;if(!a)return false;
  if(a.type==='group')return m.group_id===a.id;
  if(m.category==='send')return m.group_id===a.id;
  return (m.group_id===''||!m.group_id)&&m.user_id===a.id;
}

var _listTimer=null;
function rtScheduleListRefresh(){if(_listTimer)return;_listTimer=setTimeout(function(){_listTimer=null;rtLoadConvs(true)},1500)}

function rtCloseStream(){
  if(rtState.es){try{rtState.es.close()}catch(e){}rtState.es=null}
  rtSetConn('off','未连接');
}

function rtSetConn(state,text){
  var d=document.getElementById('rtDot');
  d.className='rt-dot'+(state==='on'?' on':(state==='off'?' off':''));
  document.getElementById('rtConnText').textContent=text;
}

function rtLinkify(text){
  var s=String(text==null?'':text),out='',last=0,m;
  var re=/\[([^\]]+)\]\((mqqapi:\/\/[^)\s]+|https?:\/\/[^)\s]+)\)|(mqqapi:\/\/\S+|https?:\/\/\S+)/g;
  while((m=re.exec(s))){
    out+=rtEsc(s.slice(last,m.index));
    if(m[1]!=null)out+='<a href="'+rtEsc(m[2])+'" target="_blank" rel="noopener">'+rtEsc(m[1])+'</a>';
    else out+='<a href="'+rtEsc(m[3])+'" target="_blank" rel="noopener">'+rtEsc(m[3])+'</a>';
    last=re.lastIndex;
  }
  out+=rtEsc(s.slice(last));
  return out;
}
function rtFmtContent(raw){
  var s=String(raw==null?'':raw);
  if(!s.trim())return '<span style="opacity:.6">[无文本内容]</span>';
  var html='';
  s.split('\n').forEach(function(line){
    var img=line.match(/^\[图片\]\s*(\S+)/);
    var vid=line.match(/^\[视频\]\s*(\S+)/);
    var aud=line.match(/^\[语音\]\s*(\S+)/);
    var file=line.match(/^\[文件\]\s*(.+)$/);
    if(img&&/^https?:\/\//.test(img[1])){
      html+='<img class="rt-img" loading="lazy" src="'+rtEsc(img[1])+'" onclick="window.open(this.src)">';
    }else if(vid&&/^https?:\/\//.test(vid[1])){
      html+='<div><a href="'+rtEsc(vid[1])+'" target="_blank" rel="noopener">[视频] 点击播放</a></div>';
    }else if(aud&&/^https?:\/\//.test(aud[1])){
      html+='<div><audio controls preload="none" src="'+rtEsc(aud[1])+'"></audio></div>';
    }else if(file){
      var parts=file[1].trim().split(/\s+/);
      var u=parts[parts.length-1];
      if(/^https?:\/\//.test(u)){
        var nm=parts.slice(0,-1).join(' ')||'下载文件';
        html+='<div><a href="'+rtEsc(u)+'" target="_blank" rel="noopener">[文件] '+rtEsc(nm)+'</a></div>';
      }else{
        html+='<div>'+rtLinkify(line)+'</div>';
      }
    }else{
      html+='<div>'+rtLinkify(line)+'</div>';
    }
  });
  return html;
}

function rtMsgNode(m,pending){
  var out=m.dir==='out';
  var div=document.createElement('div');
  div.className='rt-msg '+(out?'out':'in')+(pending?' pending':'');
  if(pending)div.setAttribute('data-pending','1');
  var name=out?'机器人':(m.sender_name||'');
  var av;
  if(out){av='<span class="rt-msg-av">机</span>'}
  else{
    var initial=m.sender_name?m.sender_name.slice(0,1):'人';
    av='<span class="rt-msg-av">'+rtAvImg(m.sender_avatar)+rtEsc(initial)+'</span>';
  }
  var whoTag=out?'':'<span>'+rtEsc(name||'未知用户')+'</span>'+(m.sender_qq?'<span class="rt-who-qq">QQ '+rtEsc(m.sender_qq)+'</span>':'')+'<span class="rt-who-qq">'+rtEsc(rtShort(m.user_id||'',12))+'</span>';
  div.innerHTML=av+'<div class="rt-msg-body"><div class="who">'+whoTag+'</div><div class="bubble">'+rtFmtContent(m.content)+'</div>'
    +'<div class="mtime">'+rtEsc(pending?'发送中…':rtFmtTime(m.created_at))+'</div></div>';
  return div;
}

function rtScrollBottom(){var b=document.getElementById('rtMsgs');b.scrollTop=b.scrollHeight}

function rtSend(){
  if(!rtState.active||rtState.sending)return;
  var ta=document.getElementById('rtInput');
  var content=ta.value.trim();
  if(!content)return;
  rtCloseEmoji();
  rtState.sending=true;
  document.getElementById('rtSend').disabled=true;
  var box=document.getElementById('rtMsgs');
  var ph=box.querySelector('.rt-placeholder');if(ph)ph.remove();
  var optimistic=rtMsgNode({dir:'out',content:content,created_at:new Date().toISOString().replace('T',' ').slice(0,19)},true);
  box.appendChild(optimistic);rtScrollBottom();
  ta.value='';ta.style.height='';
  rtApi('/api/realtime/send',{method:'POST',body:{botId:rtState.bot.appId,type:rtState.active.type,target:rtState.active.id,content:content}})
    .then(function(){setTimeout(rtReloadActive,900)})
    .catch(function(e){optimistic.remove();rtToast('发送失败：'+e.message,true)})
    .then(function(){rtState.sending=false;if(rtState.active)document.getElementById('rtSend').disabled=false});
}

function rtPickMedia(kind){
  var inp=document.getElementById('rtMedia');
  inp.setAttribute('data-kind',kind);
  inp.value='';
  inp.accept=kind==='video'?'video/*':(kind==='emoji'?'image/*,.gif':'image/*');
  inp.click();
}
function rtUploadMedia(input){
  var file=input.files&&input.files[0];
  if(!file){return}
  if(!rtState.active){rtToast('请先选择会话',true);input.value='';return}
  var kind=input.getAttribute('data-kind')||'image';
  var mediaType=kind==='video'?'video':'image';
  var fd=new FormData();
  fd.append('botId',rtState.bot.appId);
  fd.append('type',rtState.active.type);
  fd.append('target',rtState.active.id);
  fd.append('mediaType',mediaType);
  fd.append('file',file);
  rtToast('正在上传'+(mediaType==='video'?'视频':'图片')+'…');
  var savedType=rtState.active.type,savedId=rtState.active.id;
  rtApi('/api/realtime/send-media',{method:'POST',body:fd})
    .then(function(){rtToast('已发送');if(rtState.active&&rtState.active.type===savedType&&rtState.active.id===savedId)setTimeout(rtReloadActive,900)})
    .catch(function(e){rtToast('发送失败：'+e.message,true)})
    .then(function(){input.value=''});
}

/* ===== QQ 表情面板 ===== */

function rtRenderEmoji(){
  var box=document.getElementById('rtEmoji');
  if(box.getAttribute('data-ready'))return;
  box.innerHTML=RT_EMOJI.map(function(e){return '<button type="button" title="'+rtEsc(e[1])+'" data-i="'+e[0]+'" data-n="'+rtEsc(e[1])+'"><img src="https://qzonestyle.gtimg.cn/qzone/em/e'+e[0]+'.gif" alt="'+rtEsc(e[1])+'"></button>'}).join('');
  box.setAttribute('data-ready','1');
}
function rtToggleEmoji(){
  var box=document.getElementById('rtEmoji');
  rtRenderEmoji();
  var on=!box.classList.contains('show');
  box.classList.toggle('show',on);
  document.getElementById('rtEmojiBtn').classList.toggle('active',on);
  if(on){var ta=document.getElementById('rtInput');try{ta.blur()}catch(_){}}
}
function rtCloseEmoji(){
  var box=document.getElementById('rtEmoji');if(box)box.classList.remove('show');
  var b=document.getElementById('rtEmojiBtn');if(b)b.classList.remove('active');
}
function rtInsertEmoji(name){
  var ta=document.getElementById('rtInput');
  var code='/'+name;
  var s=ta.selectionStart||0,e=ta.selectionEnd||0,v=ta.value;
  ta.value=v.slice(0,s)+code+v.slice(e);
  var pos=s+code.length;
  try{ta.setSelectionRange(pos,pos)}catch(_){}
  ta.focus();
  ta.style.height='auto';ta.style.height=Math.min(ta.scrollHeight,110)+'px';
}
document.getElementById('rtEmoji').addEventListener('click',function(ev){
  var btn=ev.target.closest('button[data-n]');if(!btn)return;
  rtInsertEmoji(btn.getAttribute('data-n'));
});

function rtOpenGroupMgr(){
  var a=rtState.active;if(!a||a.type!=='group')return;
  window.open('/index.html?open=groupmgr&bot='+encodeURIComponent(rtState.bot.appId)+'&group='+encodeURIComponent(a.id),'_blank');
}

function rtBackToList(){document.getElementById('rtApp').setAttribute('data-view','list')}
function rtGoHome(){rtCloseEmoji();try{location.href='/'}catch(e){}}

  var app=document.getElementById('rtApp');
  if(app&&app.getAttribute('data-view')==='chat'){app.setAttribute('data-view','list')}

  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();rtSend()}
});
document.getElementById('rtInput').addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,110)+'px';
});
document.getElementById('rtInput').addEventListener('focus',function(){
  var ta=this;
  [0,120,300,520,800,1200].forEach(function(d){setTimeout(function(){if(window.rtSyncViewport)window.rtSyncViewport()},d)});
  setTimeout(function(){if(rtState.active)rtScrollBottom();try{ta.scrollIntoView({block:'end'})}catch(e){}},340);
});
document.getElementById('rtInput').addEventListener('blur',function(){
  [80,260,520].forEach(function(d){setTimeout(function(){if(window.rtSyncViewport)window.rtSyncViewport()},d)});
});
window.addEventListener('resize',function(){if(window.innerWidth>820)document.getElementById('rtApp').setAttribute('data-view','list')});

/* 移动端软键盘：跟随 visualViewport 高度，保证输入框完整可见 */
(function(){
  var vv=window.visualViewport;
  function sync(){
    var wh=window.innerHeight||0;
    var h=vv?(wh?Math.min(vv.height,wh):vv.height):wh;
    document.documentElement.style.setProperty('--rt-vh',Math.round(h)+'px');
    if(vv&&vv.offsetTop)window.scrollTo(0,0);
  }
  window.rtSyncViewport=sync;
  if(vv){vv.addEventListener('resize',sync);vv.addEventListener('scroll',sync)}
  window.addEventListener('resize',sync);
  window.addEventListener('orientationchange',function(){setTimeout(sync,120);setTimeout(sync,420)});
  window.addEventListener('pageshow',sync);
  sync();
})();

rtInit();
setInterval(function(){if(!document.hidden)rtLoadConvs(true)},6000);
