name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 / 编译
        run: npm run build

      # engine/napcat-repair 等用例依赖已初始化的 data/database（data/ 不入库），全量请本地 npm test
      - name: 单元测试（可离线自包含用例）
        run: npx vitest run src/core/event-bus.test.ts src/shared/bot-controls.test.ts
