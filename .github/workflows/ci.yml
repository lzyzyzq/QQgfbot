name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: 类型检查 + 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 类型检查 / 编译
        run: npm run build

      - name: 单元测试
        run: npm test
